apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: trace
spec:
  version: v0.1.3-rc0
  homepage: https://github.com/edward-milkey/kubectl-trace
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/edward-milkey/kubectl-trace/releases/download/v0.1.3-rc0/kubectl-trace_v0.1.3-rc0_darwin_amd64.tar.gz
    sha256: a6c13a8369b1fa163e3c9caa9f3847b4c7e33c5d01d7c45390f197965fbf9ae4
    bin: kubectl-trace
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/edward-milkey/kubectl-trace/releases/download/v0.1.3-rc0/kubectl-trace_v0.1.3-rc0_darwin_arm64.tar.gz
    sha256: 61cc396ce79508b0a0de4c18f55a469b0c2b074edc2a258f8154ccefa6cb955d
    bin: kubectl-trace
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/edward-milkey/kubectl-trace/releases/download/v0.1.3-rc0/kubectl-trace_v0.1.3-rc0_linux_arm64.tar.gz
    sha256: 7fac95a4dcaec4d5753b37ad90a1f442759259a47bb58da8d06ecce4032d440f
    bin: kubectl-trace
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/edward-milkey/kubectl-trace/releases/download/v0.1.3-rc0/kubectl-trace_v0.1.3-rc0_linux_amd64.tar.gz
    sha256: 1a6fe1be368ba2aa0f4c6aa1086e1a8a80dddecaea35b7cf36c495ce21b66b98
    bin: kubectl-trace
  shortDescription: Trace Kubernetes pods and nodes with system tools
  description: |
    This plugin is used to analyze production systems and Kubernetes workloads
    by scheduling a trace job on a target node or alongside a target pod in
    order to analyze it with eBPF and other tracing and profiling technologies.
